<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <title>Finance Manager</title>
    <meta name="theme-color" content="#243542" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="./favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <script>
      (function () {
        try {
          var k = "finance-manager-theme";
          var t = localStorage.getItem(k);
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            try { localStorage.setItem(k, t); } catch (e) {}
          }
          var d = t === "dark";
          var r = document.documentElement;
          r.classList.toggle("dark", d);
          r.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var k = "finance-manager-list-density";
          var v = localStorage.getItem(k);
          var d = v === "compact" ? "compact" : "comfortable";
          document.documentElement.setAttribute("data-list-density", d);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var k = "finance-manager-ui-zoom";
          var v = localStorage.getItem(k);
          var n = v == null || v === "" ? 1 : Number(v);
          if (!isFinite(n)) n = 1;
          n = Math.min(1.5, Math.max(0.75, Math.round(n / 0.05) * 0.05));
          n = Number(n.toFixed(2));
          document.documentElement.style.setProperty("--app-ui-zoom", String(n));
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="fm-root">Opening the books…</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
