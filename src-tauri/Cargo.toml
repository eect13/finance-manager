[package]
name = "finance-manager"
version = "3.61.0"
description = "Finance Manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "finance_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
